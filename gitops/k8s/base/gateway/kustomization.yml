apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomize

resources:
  - deployment.yml
  - service.yml

configMapGenerator:
  - name: gateway-config
    envs: [config.env]

secretGenerator:
  - name: gateway-secret
    envs: [secret.env]

labels:
  - pairs:
      app: gateway
      app.kubernetes.io/name: gateway
    includeSelectors: false
    includeTemplates: true