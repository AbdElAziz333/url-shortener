apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomize

resources:
  - deployment.yml
  - service.yml

configMapGenerator:
  - name: redirect-config
    envs: [config.env]

secretGenerator:
  - name: redirect-secret
    envs: [secret.env]

labels:
  - pairs:
      app: redirect
      app.kubernetes.io/name: redirect
    includeSelectors: false
    includeTemplates: true