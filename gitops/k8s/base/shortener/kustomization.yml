apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomize

resources:
  - deployment.yml
  - service.yml

configMapGenerator:
  - name: shortener-config
    envs: [config.env]

secretGenerator:
  - name: shortener-secret
    envs: [secret.env]

labels:
  - pairs:
      app: shortener
      app.kubernetes.io/name: shortener
    includeSelectors: false
    includeTemplates: true