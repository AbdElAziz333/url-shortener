version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/query.sql"
    schema: "../migrations/shortener"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_empty_slices: true # :many queries return [] instead of nil
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

          - db_type: "timestamptz"
            nullable: false
            go_type: "time.Time"

          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true

          - db_type: "date"
            nullable: false
            go_type: "time.Time"

          - db_type: "date"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true