syntax = "proto3";

package shortener;
option go_package = "aziz.dev/shortener/internal/pb";

import "google/protobuf/timestamp.proto";

message Link {
  string code = 1;
  string original_url = 2;
  google.protobuf.Timestamp expires_at = 3;
  bool is_active = 4;
  google.protobuf.Timestamp created_at = 5;
}

message GetAllLinksRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetAllLinksResponse {
  repeated Link links = 1;
}

message GetLinkByCodeRequest {
  string user_id = 1;
  string code = 2;
}

message GetLinkByCodeResponse {
  Link link = 1;
}

message CreateLinkRequest {
  string user_id = 1;
  string original_url = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message CreateLinkResponse {
  Link link = 1;
}

message UpdateExpiryRequest {
  string user_id = 1;
  string code = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message UpdateExpiryResponse {
  string message = 1;
}

message DeleteLinkRequest {
  string user_id = 1;
  string code = 2;
}

message DeleteLinkResponse {
  string message = 1;
}

service ShortenerService {
  rpc GetAllLinks(GetAllLinksRequest) returns (GetAllLinksResponse);
  rpc GetLinkByCode(GetLinkByCodeRequest) returns (GetLinkByCodeResponse);
  rpc CreateLink(CreateLinkRequest) returns (CreateLinkResponse);
  rpc UpdateExpiry(UpdateExpiryRequest) returns (UpdateExpiryResponse);
  rpc DeleteLink(DeleteLinkRequest) returns (DeleteLinkResponse);
}
