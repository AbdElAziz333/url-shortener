syntax = "proto3";

package shortener;
option go_package = "aziz.dev/shortener/internal/pb";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

message Link {
  string code = 1;
  string original_url = 2;
  google.protobuf.Timestamp expires_at = 3;
  bool is_active = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ListLinksRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListLinksResponse {
  repeated Link links = 1;
}

message GetLinkRequest {
  string user_id = 1;
  string code = 2;
}

message GetLinkResponse {
  Link link = 1;
}

message CreateLinkRequest {
  string user_id = 1;
  string original_url = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message CreateLinkResponse {
  Link link = 1;
}

message UpdateLinkExpiryRequest {
  string user_id = 1;
  string code = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message DeleteLinkRequest {
  string user_id = 1;
  string code = 2;
}

service LinkService {
  rpc ListLinks(ListLinksRequest) returns (ListLinksResponse);
  rpc GetLink(GetLinkRequest) returns (GetLinkResponse);
  rpc CreateLink(CreateLinkRequest) returns (CreateLinkResponse);
  rpc UpdateLinkExpiry(UpdateLinkExpiryRequest) returns (google.protobuf.Empty);
  rpc DeleteLink(DeleteLinkRequest) returns (google.protobuf.Empty);
}