services:
  gateway:
    image: abdelaziz333/url-gateway:0.0.6
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    build:
      context: ./backend/gateway
      dockerfile: ../Dockerfile
      args:
        APP_NAME: gateway
        APP_PORT: ${GATEWAY_PORT}
    restart: unless-stopped
    networks:
      - url-shortener-net
    environment:
      APP_ENV: docker
      APP_NAME: gateway
      APP_PORT: ${GATEWAY_PORT}
      SHORTENER_SERVICE_URL: shortener:50051
      REDIRECT_SERVICE_URL: redirect:50052
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gateway
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - all
      - app
  
  shortener:
    image: abdelaziz333/url-shortener:0.0.6
    ports:
      - "${SHORTENER_PORT}:${SHORTENER_PORT}"
      - "50051:50051"
    build:
      context: ./backend/shortener
      dockerfile: ../Dockerfile
      args:
        APP_NAME: shortener
        APP_PORT: ${SHORTENER_PORT}
    restart: unless-stopped
    networks:
      - url-shortener-net
    environment:
      APP_ENV: docker
      APP_NAME: shortener
      APP_PORT: ${SHORTENER_PORT}
      GRPC_PORT: 50051
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shortener
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - all
      - app

  redirect:
    image: abdelaziz333/url-redirect:0.0.6
    ports:
      - "${REDIRECT_PORT}:${REDIRECT_PORT}"
      - "50052:50052"
    build:
      context: ./backend/redirect
      dockerfile: ../Dockerfile
      args:
        APP_NAME: redirect
        APP_PORT: ${REDIRECT_PORT}
    restart: unless-stopped
    networks:
      - url-shortener-net
    environment:
      APP_ENV: docker
      APP_NAME: redirect
      APP_PORT: 8082
      POSTGRES_HOST: postgres
      POSTGRES_USER: aziz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shortener
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - all
      - app
  
  frontend:
    image: abdelaziz333/url-frontend:0.0.1
    ports:
      - "5173:80"
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_GATEWAY_URL: http://localhost:8080
    restart: unless-stopped
    networks:
      - url-shortener-net
    profiles:
      - all
      - app
      - frontend
      
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: postgres
    restart: unless-stopped
    networks:
      - url-shortener-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    profiles:
      - all
      - database

  redis:
    image: redis:8.6.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "${REDIS_PASSWORD}" --appendonly yes
    restart: unless-stopped
    networks:
      - url-shortener-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning PING | grep -q PONG"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    profiles:
      - database
      - all
    
volumes:
  postgres_data:
  redis_data:

networks:
  url-shortener-net:
    external: true
    driver: bridge
